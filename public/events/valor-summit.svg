<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="valorbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7e22ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f1f0c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#valorbg)"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="80" r="80" fill="#fbbf24" opacity="0.15"/>
  <circle cx="700" cy="320" r="90" fill="#fbbf24" opacity="0.12"/>
  
  <!-- Content -->
  <g>
    <!-- Summit badge -->
    <circle cx="400" cy="120" r="70" fill="#fbbf24" opacity="0.2"/>
    <circle cx="400" cy="120" r="60" fill="#ffffff" opacity="0.1"/>
    
    <!-- Mountain/Peak symbol -->
    <polygon points="400,60 440,120 360,120" fill="#fbbf24" opacity="0.8"/>
    <polygon points="420,100 450,150 390,150" fill="#fbbf24" opacity="0.6"/>
    
    <!-- Text -->
    <text x="400" y="230" font-size="44" font-weight="bold" fill="#fbbf24" text-anchor="middle">
      VALOR SUMMIT
    </text>
    <text x="400" y="270" font-size="20" fill="#ffffff" text-anchor="middle" opacity="0.95">
      Where Courage Meets Capital
    </text>
    <text x="400" y="305" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.7">
      Founder Business Summit • October 31, 2026
    </text>
  </g>
</svg>